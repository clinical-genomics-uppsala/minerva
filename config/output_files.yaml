     input: "cnv_sv/hificnv/{sample}_{type}.vcf.gz.tbi"

   - name: "hificnv_depth_bigwig"
     output: "results/cnv_sv/hificnv/{sample}_{type}.depth.bw"
     input: "cnv_sv/hificnv/{sample}_{type}.depth.bw"

   - name: "hificnv_copynum_bedgraph"
     output: "results/cnv_sv/hificnv/{sample}_{type}.copynum.bedgraph"
     input: "cnv_sv/hificnv/{sample}_{type}.copynum.bedgraph"
