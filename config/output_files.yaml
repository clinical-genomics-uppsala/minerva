---

 files:
   # reports
   - name: "cnvkit_html_reports"
     output: "results/cnv_sv/cnvkit/html_reports/{sample}_{type}.pathology.cnv_report.html"
     input: "reports/cnv_html_report/{sample}_{type}.pathology.cnv_report.html"

   - name: "excel_report"
     output: "results/xlsx_reports/{sample}_{type}_combined_report.xlsx"
     input: "reports/xlsx_reports/{sample}_{type}_combined_report.xlsx"

   - name: "multiqc_html_report"
     output: "results/qc/multiqc/multiqc_tumors.html"
     input: "qc/multiqc/multiqc_DNA.html"

   # VCF and index files
   - name: "snv_vep_annotated_vcf"
     output: "results/snv_indels/whatshap_phase/{sample}_{type}.phased.include.panel.vep_annotated.vcf.gz"
     input: "snv_indels/whatshap_phase/{sample}_{type}.phased.include.panel.vep_annotated.vcf.gz"

   - name: "sniffles2_vcf"
     output: "results/cnv_sv/sniffles2/{sample}_{type}.include.panel.vcf.gz"
     input: "cnv_sv/sniffles2_call/{sample}_{type}.include.panel.vcf.gz"

   - name: "sniffles2_vcf_index"
     output: "results/cnv_sv/sniffles2/{sample}_{type}.include.panel.vcf.gz.tbi"
     input: "cnv_sv/sniffles2_call/{sample}_{type}.include.panel.vcf.gz.tbi"

   - name: "severus_vcf"
     output: "results/cnv_sv/severus_t_only/{sample}_{type}_all_sv.include.panel.vcf.gz"
