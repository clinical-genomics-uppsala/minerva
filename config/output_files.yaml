   - name: "severus_vcf_index"
     output: "results/cnv_sv/severus_t_only/{sample}_{type}_all_sv.include.panel.vcf.gz.tbi"
     input: "cnv_sv/severus_t_only/{sample}_{type}_all_sv.include.panel.vcf.gz.tbi"

   - name: "annotated_cnvkit_vcf"
     output: "results/cnv_sv/cnvkit/cnvkit_vcf/{sample}_{type}.pathology.annotate_cnv.germline.vcf.gz"
     input: "cnv_sv/cnvkit_vcf/{sample}_{type}.pathology.annotate_cnv.germline.vcf.gz"

   - name: "index_cnvkit_vcf"
     output: "results/cnv_sv/cnvkit/cnvkit_vcf/{sample}_{type}.pathology.annotate_cnv.germline.vcf.gz.tbi"
     input: "cnv_sv/cnvkit_vcf/{sample}_{type}.pathology.annotate_cnv.germline.vcf.gz.tbi"

   - name: "pbsv_vcf"
     output: "results/cnv_sv/pbsv_call/{sample}_{type}.include.panel.vcf.gz"
     input: "cnv_sv/pbsv_call/{sample}_{type}.include.panel.vcf.gz"

   - name: "pbsv_vcf_index"
     output: "results/cnv_sv/pbsv_call/{sample}_{type}.include.panel.vcf.gz.tbi"
     input: "cnv_sv/pbsv_call/{sample}_{type}.include.panel.vcf.gz.tbi"

   - name: "svdb_merged_vcf"
     output: "results/cnv_sv/svdb_merge/{sample}_{type}.vcf"
     input: "cnv_sv/svdb_merge/{sample}_{type}.pathology.merged.vcf"

   - name: "svdb_queried_vcf"
     output: "results/cnv_sv/svdb_query/{sample}_{type}.vcf.gz"
     input: "cnv_sv/svdb_query/{sample}_{type}.pathology.svdb_query.vcf.gz"

   - name: "svdb_queried_vcf_index"
     output: "results/cnv_sv/svdb_query/{sample}_{type}.vcf.gz.tbi"
     input: "cnv_sv/svdb_query/{sample}_{type}.pathology.svdb_query.vcf.gz.tbi"

  # BAM and index files
   - name: "mapped_haplotagged_bam"
     output: "results/snv_indels/whatshap_haplotag/{sample}_{type}.haplotagged.bam"
     input: "snv_indels/whatshap_haplotag/{sample}_{type}.haplotagged.bam"

   - name: "mapped_haplotagged_bam_index"
     output: "results/snv_indels/whatshap_haplotag/{sample}_{type}.haplotagged.bam.bai"
     input: "snv_indels/whatshap_haplotag/{sample}_{type}.haplotagged.bam.bai"

   - name: "pbmm2_bam"
     output: "results/mapped_bam/pbmm2_align/{sample}_{type}.bam"
     input: "alignment/pbmm2_align/{sample}_{type}.bam"

   - name: "vacmap_bam"
     output: "results/mapped_bam/vacmap_align/{sample}_{type}.bam"
     input: "alignment/vacmap_align/{sample}_{type}.bam"

   # Other
   - name: "cnvkit_cnr"
     output: "results/cnv_sv/cnvkit/cnvkit_batch/{sample}_{type}.cnr"
     input: "cnv_sv/cnvkit_batch/{sample}/{sample}_{type}.cnr"

   - name: "cnvkit_cns"
     output: "results/cnv_sv/cnvkit/cnvkit_batch/{sample}_{type}.cns"
     input: "cnv_sv/cnvkit_batch/{sample}/{sample}_{type}.cns"

   - name: "coverage_regions"
     output: "results/qc/mosdepth/{sample}_{type}.regions.bed.gz"
     input: "qc/mosdepth/{sample}_{type}.regions.bed.gz"

   - name: "hificnv_vcf"
     output: "results/cnv_sv/hificnv/{sample}_{type}.vcf.gz"
     input: "cnv_sv/hificnv/{sample}_{type}.vcf.gz"

   - name: "hificnv_vcf_index"
